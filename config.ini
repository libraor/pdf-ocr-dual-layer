# ============================================================
# PDF 双层转换配置文件
# 作者：林尧 · 浙江泽大律师事务所 高级合伙人 · linyao@foxmail.com
# ============================================================
# 优先级：环境变量 > 本配置文件 > 代码默认值
# 配置文件查找位置（按顺序）：
#   1. 环境变量 PDF_OCR_CONFIG_FILE 指定的路径
#   2. 脚本所在目录的 config.ini
# 行首 # 或 ; 为注释，行内 # 之后内容不被视为注释
# 布尔值：true / false / 1 / 0 / yes / no / on /  off（不区分大小写）
# ============================================================


[server]
# Umi-OCR HTTP 服务端口探测列表
# 端口可能因占用而漂移，按顺序尝试
# 多个端口用逗号分隔
try_ports = 1224, 1225, 1226, 1227, 1228, 1229, 1230, 1241


[http]
# HTTP 请求超时（秒）- 上传/下载/普通请求
request_timeout = 30

# 轮询专用超时（秒）- OCR 处理大文件时响应慢，需要更长
poll_timeout = 60

# 下载专用超时（秒）- Umi-OCR 生成下载文件可能耗时（多页 PDF）
# 用于：POST 获取下载链接 + GET 下载文件
# 如果大文件下载超时失败，增大此值
download_timeout = 300

# 上传专用超时（秒）- 大 PDF（>100MB）上传可能超过 request_timeout
# 未配置时默认取 max(request_timeout, download_timeout)
# upload_timeout = 300

# 轮询间隔（秒）- 检查任务状态的频率
poll_interval = 2

# 单个 PDF 最大处理时间（秒）- 超时则放弃当前文件
# 大型扫描件（如几十页银行流水）可能需要 20-30 分钟
# 600=10分钟, 1800=30分钟, 3600=60分钟
max_poll_time = 1800

# 轮询进度提示间隔（秒）- 长时间 OCR 时每隔多久打印等待时长
progress_notify_interval = 60

# 下载重试次数 - 下载失败时按指数退避重试
download_retries = 5


[storage]
# 本地工作目录（缓存/日志/进度/备份）
# 留空则使用系统默认：
#   Windows: %LOCALAPPDATA%\pdf-ocr-dual-layer
#   Linux/Mac: ~/.local/share/pdf-ocr-dual-layer
# 示例：D:\pdf-ocr-work
work_dir =


[behavior]
# 是否备份原文件（覆盖前备份到本地专用目录）
# 关闭后原文件将被直接覆盖，风险自负
backup_original = true

# 转换后是否验证新 PDF 有效性（页数、文本层等）
# 验证失败自动从备份恢复原文件
verify_on_success = true

# 验证通过后是否清理备份（节省硬盘空间）
# 关闭则保留所有备份，可用于手动回滚
cleanup_backup_on_success = true

# 文本层检测阈值 - 有文本页数 / 抽样页数 ≥ 此值才判定为双层
# 0.5 = 半数以上抽样页有文本即视为双层
# 1.0 = 所有抽样页都必须有文本
# 0.0 = 任意一页有文本即视为双层
text_layer_ratio = 0.5

# OCR 并发任务数 - 同时处理的文件数
# Umi-OCR 内部支持任务队列，并发上传可让 OCR 引擎持续工作
# 推荐：2-4（太高会占用大量内存和 CPU）12个并发任务也可以接受
# 1 = 串行模式（与旧版行为一致）
max_concurrent_ocr = 12


[filter]
# ============================================================
# 文件名排除规则（不区分大小写，支持通配符 * ?）
# 匹配文件名（不含路径）的 PDF 会被标记为 excluded，永久跳过不 OCR
# 多个模式用逗号分隔
# ============================================================

# 排除模式示例：
#   *银行流水*    - 跳过所有文件名含"银行流水"的 PDF（如几十页扫描件，OCR 耗时极长）
#   *流水*        - 更宽泛的流水匹配
#   *身份证*      - 跳过身份证扫描件
#   *_tmp_*       - 跳过临时文件
# 留空则不排除任何文件
exclude_patterns = *流水*


[ocr]
# ============================================================
# Umi-OCR 识别参数（传递给 Umi-OCR HTTP API）
# 官方文档：https://github.com/hiroi-sora/Umi-OCR/blob/main/docs/http/api_doc.md
# ============================================================

# 内容提取模式
# mixed      - 混合OCR/原文本（智能区分图片与文本区域，推荐用于图文混排）
# fullPage   - 整页强制OCR（将整个页面视为图片处理，适合纯图片扫描件）
# ocrOnly    - 仅OCR图片（只处理文档中的图片元素）
# 注意：textOnly 仅由脚本内部用于文本层检测，不可在此设置
extraction_mode = mixed

# 语言/模型库
# models/config_chinese.txt         - 简体中文（默认）
# models/config_en.txt              - English
# models/config_chinese_cht(v2).txt - 繁體中文
# models/config_japan.txt           - 日本語
# models/config_korean.txt          - 한국어
# models/config_cyrillic.txt        - Русский
language = models/config_chinese.txt

# 纠正文本方向（识别倾斜或倒置的文本）
# 启用可识别 90/180/270 度旋转的文本，但可能降低识别速度
# true / false
cls = true

# 限制图像边长
# 将边长大于该值的图片进行压缩，可以提高识别速度，但可能降低识别精度
# 960    - 默认，速度优先
# 2880   - 平衡
# 4320   - 精度优先
# 999999 - 无限制（最高精度，最慢）
limit_side_len = 960

# 排版解析方案（按什么方式解析和排序图片中的文字块）
# multi_para   - 多栏-按自然段换行（默认，适合普通文档）
# multi_line   - 多栏-总是换行
# multi_none   - 多栏-无换行
# single_para  - 单栏-按自然段换行
# single_line  - 单栏-总是换行
# single_none  - 单栏-无换行
# single_code  - 单栏-保留缩进（适合代码截图）
parser = multi_para


# ============================================================
# 配置组合速查（behavior 段三项组合）
# ============================================================
# backup_original | verify_on_success | cleanup_backup_on_success | 行为
# ----------------+-------------------+--------------------------|-------------------------
# true            | true              | true                     | 默认：备份->OCR->验证->通过清理/失败回滚
# true            | true              | false                    | 备份保留：验证通过也保留备份
# true            | false             | -                        | 不验证：OCR 完即视为成功，备份保留
# false           | -                 | -                        | 不备份：直接覆盖原文件（不推荐）
# ============================================================


# ============================================================
# 对应的环境变量（优先级最高，覆盖本文件）
# ============================================================
# PDF_OCR_CONFIG_FILE           指定配置文件路径
# PDF_OCR_WORK_DIR              本地工作目录（对应 [storage] work_dir）
# PDF_OCR_BACKUP                是否备份原文件（对应 [behavior] backup_original）
# PDF_OCR_VERIFY                是否验证（对应 [behavior] verify_on_success）
# PDF_OCR_CLEANUP_BACKUP        是否清理备份（对应 [behavior] cleanup_backup_on_success）
# PDF_OCR_TIMEOUT               HTTP 请求超时（对应 [http] request_timeout）
# PDF_OCR_POLL_TIMEOUT          轮询超时（对应 [http] poll_timeout）
# PDF_OCR_DOWNLOAD_TIMEOUT      下载超时（对应 [http] download_timeout）
# PDF_OCR_UPLOAD_TIMEOUT        上传超时（对应 [http] upload_timeout）
# PDF_OCR_POLL_INTERVAL         轮询间隔（对应 [http] poll_interval）
# PDF_OCR_MAX_TIME              单文件最大处理时间（对应 [http] max_poll_time）
# PDF_OCR_PORTS                 端口列表（对应 [server] try_ports）
# PDF_OCR_EXTRACTION_MODE       提取模式（对应 [ocr] extraction_mode）
# PDF_OCR_LANGUAGE              语言（对应 [ocr] language）
# PDF_OCR_CLS                   方向纠正（对应 [ocr] cls）
# PDF_OCR_LIMIT_SIDE_LEN        图像边长限制（对应 [ocr] limit_side_len）
# PDF_OCR_PARSER                排版解析（对应 [ocr] parser）
# PDF_OCR_EXCLUDE               排除模式（对应 [filter] exclude_patterns，逗号分隔）
# PDF_OCR_MAX_CONCURRENT        并发任务数（对应 [behavior] max_concurrent_ocr）
# ============================================================
